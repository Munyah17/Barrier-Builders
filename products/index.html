<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Barrier Builders</title>
  <meta name="description" content="Diamond mesh, game fence, clear view, palisade, razor wire, gates and posts — in stock at Barrier Builders, Harare.">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=6">
</head>
<body>
<div id="site-header"></div>
<section class="section">
  <div class="container">
    <!-- Filter bar -->
    <div class="filter-bar" style="margin-bottom:16px">
      <div class="field" style="flex:1;min-width:200px">
        <input type="search" id="q" placeholder="Search fencing, gates, posts…" aria-label="Search products">
      </div>
      <div class="field" style="min-width:160px">
        <select id="sortBy" aria-label="Sort products">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </div>
      <div class="field" style="min-width:150px">
        <select id="stockFilter" aria-label="Filter by stock">
          <option value="all">Any availability</option>
          <option value="instock">In stock</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
      </div>
      <button class="btn btn-gold cart-btn" id="cartBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>

    <!-- Category jump chips -->
    <div class="chips" id="cats" style="margin-bottom:24px"></div>

    <!-- Category sections -->
    <div id="sections"></div>
  </div>
</section>

<!-- Cart drawer -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart">
  <div class="cart-head">
    <h3>Your cart</h3>
    <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <div class="cart-total-row"><span>Total</span><strong id="cartTotal">$0.00</strong></div>
    <p class="cart-note">VAT calculated at checkout · Free Harare delivery over $500</p>
    <button class="btn btn-gold btn-block" id="checkoutBtn" type="button">Checkout</button>
  </div>
</aside>

<!-- Checkout modal -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <div class="modal-head">
      <h3>Checkout</h3>
      <button class="cart-close" id="checkoutClose" aria-label="Close">&times;</button>
    </div>
    <form id="checkoutForm">
      <div class="modal-body">
        <div class="checkout-summary" id="checkoutSummary"></div>
        <div class="field" style="margin-bottom:12px">
          <label>Full name <span class="req">*</span></label>
          <input name="name" required placeholder="Your name">
        </div>
        <div class="field" style="margin-bottom:12px">
          <label>Phone or email <span class="req">*</span></label>
          <input name="contact" required placeholder="0772 … or you@email.com">
        </div>
        <div class="field" style="margin-bottom:12px">
          <label>Email (optional)</label>
          <input name="email" type="email" placeholder="you@email.com">
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <textarea name="notes" rows="3" placeholder="Delivery address, preferred date, special instructions"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" id="checkoutCancel">Cancel</button>
        <button type="submit" class="btn btn-green">Place order</button>
      </div>
    </form>
  </div>
</div>

<div id="site-footer"></div>
<script src="../js/store.js?v=14"></script>
<script src="../js/ui.js?v=8"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  let activeCat = params.get("cat") || "All";
  let stock = "all", sort = "featured", query = "";

  // ---- Cart state (localStorage) ----
  const CART_KEY = "bfs_cart";
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch(e) { cart = []; }

  function saveCart() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); updateCartUI(); }
  function cartCount() { return cart.reduce((s, i) => s + i.qty, 0); }
  function cartTotal() { return cart.reduce((s, i) => { const p = BFS.product(i.slug); return s + (p ? p.pricePerM * i.qty : 0); }, 0); }

  function addToCart(slug, qty) {
    qty = Math.max(1, parseInt(qty) || 1);
    const existing = cart.find(i => i.slug === slug);
    if (existing) existing.qty += qty;
    else cart.push({ slug, qty });
    saveCart();
    BFSUI.toast("Added to cart");
  }

  function updateCartUI() {
    const badge = document.getElementById("cartBadge");
    if (badge) badge.textContent = cartCount();
    renderCartDrawer();
  }

  // ---- Product helpers ----
  const stockStatus = p => p.stock <= 0 ? "out" : p.stock < 30 ? "low" : "instock";
  const stockLabels = { instock: "In stock", low: "Low stock", out: "Out of stock" };

  function productCard(p) {
    const st = stockStatus(p);
    const stockCls = st === "out" ? "stock-out" : st === "low" ? "stock-low" : "stock-ok";
    const stockTxt = st === "out" ? "Out of stock" : `${p.stock} ${p.stockUnit}`;
    const inCart = cart.find(i => i.slug === p.slug);
    const qty = inCart ? inCart.qty : 1;
    return `<div class="product-card">
      <a class="product-link" href="../product?slug=${p.slug}">
        <div class="thumb" style="background-image:url('${BFS.asset(p.image)}')"></div>
        <div class="body">
          <span class="cat">${p.category}</span>
          <h3>${p.name}</h3>
          <p>${p.short}</p>
          <div class="meta"><span class="price">from $${p.pricePerM.toFixed(2)} / ${p.unit}</span><span class="${stockCls}">${stockTxt}</span></div>
        </div>
      </a>
      <div class="card-actions">
        <div class="qty-control">
          <button class="qty-btn" data-dec="${p.slug}" aria-label="Decrease">&minus;</button>
          <span class="qty-val" data-qty="${p.slug}">${qty}</span>
          <button class="qty-btn" data-inc="${p.slug}" aria-label="Increase">+</button>
        </div>
        <button class="btn btn-gold btn-sm add-cart-btn" data-add="${p.slug}" ${st==="out"?"disabled":""}>Add to cart</button>
      </div>
    </div>`;
  }

  function filteredProducts() {
    let items = BFS.products();
    if (activeCat !== "All") items = items.filter(p => p.category === activeCat);
    if (stock !== "all") items = items.filter(p => stockStatus(p) === stock);
    if (query) {
      const q = query.toLowerCase();
      items = items.filter(p =>
        p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) ||
        (p.short||"").toLowerCase().includes(q) || (p.keywords||[]).join(" ").includes(q));
    }
    if (sort === "price-asc") items.sort((a,b) => a.pricePerM - b.pricePerM);
    else if (sort === "price-desc") items.sort((a,b) => b.pricePerM - a.pricePerM);
    else if (sort === "name") items.sort((a,b) => a.name.localeCompare(b.name));
    else items.sort((a,b) => (b.featured?1:0) - (a.featured?1:0));
    return items;
  }

  function render() {
    const items = filteredProducts();
    const cats = ["All", ...new Set(BFS.products().map(p => p.category))];

    // Category chips
    document.getElementById("cats").innerHTML = cats.map(c =>
      `<button class="chip ${c===activeCat?"on":""}" data-c="${c}">${c}</button>`).join("");

    // Sections
    const sectionsEl = document.getElementById("sections");
    if (activeCat === "All") {
      // Show all categories as sections
      const grouped = {};
      items.forEach(p => { (grouped[p.category] = grouped[p.category] || []).push(p); });
      const catOrder = cats.filter(c => c !== "All");
      sectionsEl.innerHTML = catOrder.map(cat => {
        const prods = grouped[cat] || [];
        if (!prods.length) return "";
        return `<section class="cat-section" id="cat-${cat.toLowerCase().replace(/\s+/g,"-")}">
          <div class="cat-section-head">
            <h2>${cat}</h2>
            <span class="cat-count">${prods.length} product${prods.length>1?"s":""}</span>
          </div>
          <div class="cat-grid">${prods.map(productCard).join("")}</div>
        </section>`;
      }).join("");
    } else {
      // Single category view
      sectionsEl.innerHTML = `<section class="cat-section">
        <div class="cat-section-head">
          <h2>${activeCat}</h2>
          <span class="cat-count">${items.length} product${items.length>1?"s":""}</span>
        </div>
        <div class="cat-grid">${items.map(productCard).join("")}</div>
      </section>`;
    }

    if (!items.length) {
      sectionsEl.innerHTML = `<div class="cart-empty" style="padding:60px 20px"><div class="cart-empty-icon">&#128269;</div><p>No products match your filters.</p></div>`;
    }

    // Bind category chips
    document.querySelectorAll("#cats .chip").forEach(b => b.onclick = () => {
      activeCat = b.dataset.c;
      render();
      if (activeCat !== "All") {
        const sec = document.querySelector(".cat-section");
        if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    // Bind add-to-cart and qty controls
    document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const slug = b.dataset.add;
      const qtyEl = document.querySelector(`[data-qty="${slug}"]`);
      const qty = qtyEl ? parseInt(qtyEl.textContent) : 1;
      addToCart(slug, qty);
    });
    document.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => {
      const slug = b.dataset.inc;
      const el = document.querySelector(`[data-qty="${slug}"]`);
      const p = BFS.product(slug);
      let v = parseInt(el.textContent) + 1;
      if (p && p.stock > 0 && v > p.stock) v = p.stock;
      el.textContent = v;
    });
    document.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => {
      const slug = b.dataset.dec;
      const el = document.querySelector(`[data-qty="${slug}"]`);
      let v = parseInt(el.textContent) - 1;
      if (v < 1) v = 1;
      el.textContent = v;
    });
  }

  // ---- Cart drawer ----
  function renderCartDrawer() {
    const body = document.getElementById("cartBody");
    const total = document.getElementById("cartTotal");
    if (!body) return;
    if (!cart.length) {
      body.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">&#128722;</div><p>Your cart is empty.</p><p class="hint">Browse products and add items to get started.</p></div>`;
      total.textContent = "$0.00";
      return;
    }
    body.innerHTML = cart.map(item => {
      const p = BFS.product(item.slug);
      if (!p) return "";
      const lineTotal = p.pricePerM * item.qty;
      return `<div class="cart-item">
        <div class="ci-thumb" style="background-image:url('${BFS.asset(p.image)}')"></div>
        <div class="ci-info">
          <p class="ci-name">${p.name}</p>
          <span class="ci-unit">$${p.pricePerM.toFixed(2)} / ${p.unit}</span>
          <span class="ci-price">$${lineTotal.toFixed(2)}</span>
          <div class="ci-controls">
            <button class="ci-qty" data-ci-dec="${p.slug}" aria-label="Decrease">&minus;</button>
            <span class="ci-qty-val">${item.qty}</span>
            <button class="ci-qty" data-ci-inc="${p.slug}" aria-label="Increase">+</button>
            <button class="ci-remove" data-ci-remove="${p.slug}">Remove</button>
          </div>
        </div>
      </div>`;
    }).join("");
    total.textContent = "$" + cartTotal().toFixed(2);

    // Bind cart item controls
    body.querySelectorAll("[data-ci-dec]").forEach(b => b.onclick = () => {
      const item = cart.find(i => i.slug === b.dataset.ciDec);
      if (item) { item.qty = Math.max(1, item.qty - 1); saveCart(); }
    });
    body.querySelectorAll("[data-ci-inc]").forEach(b => b.onclick = () => {
      const item = cart.find(i => i.slug === b.dataset.ciInc);
      const p = BFS.product(b.dataset.ciInc);
      if (item && p) { item.qty = Math.min(p.stock || 999, item.qty + 1); saveCart(); }
    });
    body.querySelectorAll("[data-ci-remove]").forEach(b => b.onclick = () => {
      cart = cart.filter(i => i.slug !== b.dataset.ciRemove);
      saveCart();
    });
  }

  function openCart() {
    document.getElementById("cartOverlay").classList.add("open");
    document.getElementById("cartDrawer").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeCart() {
    document.getElementById("cartOverlay").classList.remove("open");
    document.getElementById("cartDrawer").classList.remove("open");
    document.body.style.overflow = "";
  }

  document.getElementById("cartBtn").onclick = openCart;
  document.getElementById("cartClose").onclick = closeCart;
  document.getElementById("cartOverlay").onclick = closeCart;

  // ---- Checkout ----
  function openCheckout() {
    if (!cart.length) { BFSUI.toast("Your cart is empty."); return; }
    closeCart();
    // Build summary
    const summary = document.getElementById("checkoutSummary");
    summary.innerHTML = cart.map(item => {
      const p = BFS.product(item.slug);
      if (!p) return "";
      return `<div class="cs-item"><span>${p.name} × ${item.qty} ${p.unit}</span><strong>$${(p.pricePerM * item.qty).toFixed(2)}</strong></div>`;
    }).join("") + `<div class="cs-total"><span>Total</span><span>$${cartTotal().toFixed(2)}</span></div>`;
    document.getElementById("checkoutModal").classList.add("open");
  }
  function closeCheckout() {
    document.getElementById("checkoutModal").classList.remove("open");
  }

  document.getElementById("checkoutBtn").onclick = openCheckout;
  document.getElementById("checkoutClose").onclick = closeCheckout;
  document.getElementById("checkoutCancel").onclick = closeCheckout;
  document.getElementById("checkoutModal").addEventListener("click", e => {
    if (e.target === document.getElementById("checkoutModal")) closeCheckout();
  });

  document.getElementById("checkoutForm").onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = fd.get("name").trim();
    const contact = fd.get("contact").trim();
    const email = fd.get("email").trim();
    const notes = fd.get("notes").trim();
    if (!name || !contact) { BFSUI.toast("Enter your name and a phone or email."); return; }

    // Build quote items from cart
    const items = cart.map(item => {
      const p = BFS.product(item.slug);
      const qty = item.qty;
      const unitPrice = p.pricePerM;
      return { name: p.name, qty: qty + " " + p.unit, qtyNum: qty, unitPrice, total: Math.round(qty * unitPrice * 100) / 100 };
    });
    const subtotal = items.reduce((s, i) => s + i.total, 0);

    // Create quote
    const q = BFS.saveQuote({
      source: "products-cart",
      status: "sent",
      customer: { name, contact, email: email || (contact.includes("@") ? contact : ""), notes },
      project: { typeName: "Product order", perimeter: 0, height: 0, spacing: 0 },
      items,
      subtotal
    });

    // Save lead
    try {
      BFS.saveLead({
        type: "order", name, contact, email: email || (contact.includes("@") ? contact : ""),
        notes, quoteRef: q.ref, quoteId: q.id, items: q.items, subtotal: q.subtotal, total: q.total,
        project: q.project, typeName: "Product order", perimeter: 0
      });
    } catch(err) {}

    // Clear cart
    cart = [];
    saveCart();
    closeCheckout();

    // Redirect to quote page
    location.href="../quote?ref=" + encodeURIComponent(q.ref);
  };

  // ---- Filter bindings ----
  document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
  document.getElementById("sortBy").addEventListener("change", e => { sort = e.target.value; render(); });
  document.getElementById("stockFilter").addEventListener("change", e => { stock = e.target.value; render(); });

  // ---- Init ----
  updateCartUI();
  render();
});
</script>
</body>
</html>
