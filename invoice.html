<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice | Barrier Fencing Solutions</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<section class="section"><div class="container" id="wrap"></div></section>
<div id="site-footer"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const ref = new URLSearchParams(location.search).get("ref");
  const inv = BFS.invoice(ref);
  const s = BFS.settings();
  if (!inv) { wrap.innerHTML = '<div class="doc"><h2>Invoice not found</h2></div>'; return; }
  document.title = inv.ref + " | Tax Invoice";
  wrap.innerHTML = `
    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;justify-content:center">
      <button class="btn btn-gold" onclick="print()">Print / PDF</button>
      ${inv.tracking ? `<a class="btn btn-outline" href="track.html?code=${inv.tracking}">Track order ${inv.tracking}</a>` : ""}
    </div>
    <article class="doc">
      <div class="doc-top">
        <div>
          <img src="assets/logo.svg" alt="" width="44">
          <h2 style="margin-top:8px">${s.company}</h2>
          <p class="hint">${s.address}<br>${s.vatNumber}<br>${s.phone}</p>
        </div>
        <div style="text-align:right">
          <div class="badge badge-green">Tax Invoice</div>
          <h3 style="margin-top:8px">${inv.ref}</h3>
          <p class="hint">From quote ${inv.quoteRef}<br>Issued ${new Date(inv.createdAt).toLocaleDateString()} · Due ${new Date(inv.dueAt).toLocaleDateString()}<br>Status: ${inv.status}</p>
        </div>
      </div>
      <p><strong>Bill to:</strong> ${inv.customer.name} · ${inv.customer.contact}</p>
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th class="right">Amount</th></tr></thead>
        <tbody>${inv.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td class="right">$${BFS.money(i.total)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="doc-totals">
        <div><span>Subtotal</span><span>$${BFS.money(inv.subtotal)}</span></div>
        <div><span>VAT ${Math.round(s.vatRate*100)}%</span><span>$${BFS.money(inv.vat)}</span></div>
        <div class="big"><span>Total due</span><span>$${BFS.money(inv.total)}</span></div>
      </div>
      <p class="hint" style="margin-top:24px">${s.bank}</p>
    </article>`;
});
</script>
</body>
</html>
