<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promotions | Barrier Builders</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=5">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero" style="background-image:url('../assets/img/field-fence.jpg')">
  <div class="container">
    <div class="crumbs"><a href="../index">Home</a> <span class="sep">›</span> Promotions</div>
    <h1>Current offers</h1>
    <p>Posted from the admin portal. Farm bulk, diaspora packages and school pricing.</p>
  </div>
</section>
<section class="section">
  <div class="container grid-3" id="list"></div>
</section>
<div id="site-footer"></div>
<script src="../js/store.js?v=12"></script>
<script src="../js/ui.js?v=7"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  list.innerHTML = BFS.promotions().map(p => `
    <article class="feature-card">
      <span class="badge badge-gold">${p.tag}</span>
      <h3 style="margin-top:10px">${p.title}</h3>
      <p>${p.body}</p>
      <p class="hint">${p.starts} → ${p.ends}</p>
    </article>`).join("") || '<p>No live promotions.</p>';
});
</script>
</body>
</html>
