<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Barrier Builders</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=6">
</head>
<body>
<div id="site-header"></div>
<div id="main"></div>
<div id="site-footer"></div>
<script src="../js/store.js?v=14"></script>
<script src="../js/ui.js?v=8"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const slug = new URLSearchParams(location.search).get("slug");
  const p = BFS.product(slug);
  if (!p) { location.href="../products"; return; }
  document.title = p.name + " | Barrier Builders";
  const specs = Object.entries(p.specs || {}).map(([k,v]) => `<div class="qp-row"><span style="text-transform:capitalize">${k}</span><span>${v}</span></div>`).join("");
  document.getElementById("main").innerHTML = `
    <section class="page-hero" style="background-image:url('${BFS.asset(p.image)}')">
      <div class="container">
        <div class="crumbs"><a href="../index">Home</a> <span class="sep">›</span> <a href="../products">Products</a> <span class="sep">›</span> ${p.name}</div>
        <h1>${p.name}</h1>
        <p>${p.short}</p>
      </div>
    </section>
    <section class="section">
      <div class="container split">
        <div>
          <img src="${BFS.asset(p.image)}" alt="${p.name}" style="border-radius:16px;width:100%;aspect-ratio:4/3;object-fit:cover">
          <p style="margin-top:22px;font-size:16px">${p.description}</p>
        </div>
        <aside class="panel sticky-panel">
          <div class="panel-head"><div><h2>From $${p.pricePerM.toFixed(2)} / m</h2><p class="hint">${p.stock} ${p.stockUnit} in the Harare yard</p></div></div>
          <div class="panel-body">
            ${specs}
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
              <a class="btn btn-gold btn-block" href="../calculator?type=${p.slug}">Quote this fence</a>
              <a class="btn btn-outline btn-block" href="../estimator">Describe the job to AI</a>
            </div>
          </div>
        </aside>
      </div>
    </section>`;
});
</script>
</body>
</html>
