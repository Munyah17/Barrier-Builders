<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Barrier Builders</title>
  <meta name="description" content="Completed fencing projects across Zimbabwe — homes, schools, farms, shops and warehouses. Every project documented with fence type, materials and cost.">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var __t=localStorage.getItem("bfs-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=__t}catch(e){}</script>
  <link rel="stylesheet" href="../css/styles.css?v=7">

</head>
<body>
<div id="site-header"></div>
<section class="page-hero" style="background-image:url('../assets/img/gallery-game-v2.jpg')">
  <div class="container">
    <div class="crumbs"><a href="../index">Home</a> <span class="sep">›</span> Projects</div>
    <h1>Fences we have built</h1>
    <p>Homes, schools, farms, shops and warehouses across Zimbabwe. Every project is documented — fence type, materials, justification and cost.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="chips" id="cats" style="margin-bottom:22px"></div>
    <div class="gallery-grid" id="grid"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="../js/store.js?v=18"></script>
<script src="../js/ui.js?v=12"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const areaOf = g => g.areaType || g.type || "Other";
  const fenceOf = g => g.fenceType || "";
  let type = "All";
  const types = ["All", ...new Set(BFS.gallery().map(areaOf))];
  const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  function card(g) {
    const area = areaOf(g), fence = fenceOf(g);
    return `
      <a class="gallery-item project-card" href="../project/?id=${encodeURIComponent(g.id)}">
        <img src="${BFS.asset(g.image)}" alt="${esc(g.title)}" loading="lazy">
        <figcaption>
          <strong>${esc(g.title)}</strong><br>
          <span style="opacity:.85">${esc(g.location||"")}${g.year?" · "+g.year:""}</span><br>
          <span class="badge badge-green" style="margin-top:6px;display:inline-block">${esc(area)}</span>
          ${fence?`<span class="badge" style="margin-top:6px;margin-left:4px;display:inline-block">${esc(fence)}</span>`:""}
          ${g.cost?`<div style="margin-top:6px;font-weight:600">$${BFS.money(g.cost)}</div>`:""}
        </figcaption>
      </a>`;
  }
  function render() {
    cats.innerHTML = types.map(t => `<button class="chip ${t===type?"on":""}" data-t="${t}">${t}</button>`).join("");
    const items = BFS.gallery().filter(g => type==="All" || areaOf(g)===type);
    grid.innerHTML = items.map(card).join("") || `<p class="hint">No projects in this category yet.</p>`;
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { type = b.dataset.t; render(); });
  }
  render();
});
</script>
</body>
</html>
