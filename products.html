<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Barrier Fencing Solutions</title>
  <meta name="description" content="Diamond mesh, game fence, clear view, palisade, razor wire, gates and posts — in stock at Barrier Fencing Solutions, Harare.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero" style="background-image:url('assets/img/diamond-mesh.jpg')">
  <div class="container">
    <div class="crumbs"><a href="index.html">Home</a> <span class="sep">›</span> Products</div>
    <h1>The yard catalogue</h1>
    <p>Twelve product lines, priced in USD. Stock figures update from the admin portal.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="chips" id="cats" style="margin-bottom:24px"></div>
    <div class="grid-3" id="list"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  let cat = params.get("cat") || "All";
  const cats = ["All", ...new Set(BFS.products().map(p => p.category))];
  function render() {
    document.getElementById("cats").innerHTML = cats.map(c =>
      `<button class="chip ${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
    const items = BFS.products().filter(p => cat==="All" || p.category===cat);
    document.getElementById("list").innerHTML = items.map(p => {
      const stockCls = p.stock < 30 ? "stock-low" : "stock-ok";
      return `<a class="product-card" href="product.html?slug=${p.slug}">
        <div class="thumb" style="background-image:url('${BFS.asset(p.image)}')"></div>
        <div class="body">
          <span class="cat">${p.category}</span>
          <h3>${p.name}</h3>
          <p>${p.short}</p>
          <div class="meta"><span class="price">from $${p.pricePerM.toFixed(2)} / m</span><span class="${stockCls}">${p.stock} ${p.stockUnit}</span></div>
        </div>
      </a>`;
    }).join("");
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
  }
  render();
});
</script>
</body>
</html>
