<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Barrier Fencing Solutions</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
<div id="app"></div>
<script src="../js/store.js"></script>
<script src="../js/estimator.js"></script>
<script>
const $ = (s, el=document) => el.querySelector(s);
const route = () => (location.hash.replace(/^#\/?/, "") || "dashboard").split("/");

function requireAuth() {
  if (!BFS.isAuthed()) { renderLogin(); return false; }
  return true;
}

function renderLogin() {
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <form class="login-card" id="login">
        <img src="../assets/logo.svg" width="48" height="48" alt="">
        <h1>Yard office</h1>
        <p class="hint" style="margin-bottom:16px">Barrier Fencing Solutions admin. Default login is in the README — change it under Settings after first sign-in.</p>
        <div class="field"><label>Username</label><input id="user" autocomplete="username"></div>
        <div class="field" style="margin-top:10px"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
        <button class="btn btn-gold btn-block" style="margin-top:16px">Sign in</button>
        <p class="hint" id="err" style="color:var(--danger);margin-top:10px"></p>
      </form>
    </div>`;
  login.onsubmit = e => {
    e.preventDefault();
    if (BFS.login(user.value.trim(), pass.value)) { location.hash = "#/dashboard"; render(); }
    else err.textContent = "Those credentials do not match.";
  };
}

function shell(title, body, extra="") {
  const r = route()[0];
  const link = (hash, label) => `<a href="#/${hash}" class="${r===hash?"active":""}">${label}</a>`;
  return `<div class="admin-shell">
    <aside class="sidenav">
      <div class="brand"><img src="../assets/logo.svg" width="32" height="32" alt=""><strong>Barrier Admin</strong></div>
      ${link("dashboard","Dashboard")}
      ${link("analytics","Analytics")}
      ${link("products","Inventory")}
      ${link("promotions","Promotions")}
      ${link("quotes","Quotations")}
      ${link("invoices","Invoices")}
      ${link("orders","Orders")}
      ${link("gallery","Gallery")}
      ${link("messages","Messages")}
      ${link("settings","Settings")}
      <div class="grow"></div>
      <a href="../index.html">View website</a>
      <button class="navb" id="logout">Sign out</button>
    </aside>
    <main class="admin-main">
      <div class="admin-top"><h1>${title}</h1><div>${extra}</div></div>
      ${body}
    </main>
  </div>`;
}

function kpi(lbl, val){ return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`; }

function dashboard() {
  const quotes = BFS.quotes();
  const invoices = BFS.invoices();
  const orders = BFS.orders();
  const revenue = invoices.filter(i => i.status==="paid").reduce((s,i)=>s+i.total,0);
  const low = BFS.products().filter(p => p.stock < 40);
  const recent = quotes.slice(0,5).map(q => `<tr>
    <td><a href="#/quote/${q.ref}">${q.ref}</a></td><td>${q.customer.name}</td>
    <td>$${BFS.money(q.total)}</td><td><span class="badge badge-gold">${q.status}</span></td></tr>`).join("");
  return shell("Dashboard", `
    <div class="kpi-grid">
      ${kpi("Quotations", quotes.length)}
      ${kpi("Invoices", invoices.length)}
      ${kpi("Paid revenue", "$"+BFS.money(revenue))}
      ${kpi("Open orders", orders.filter(o=>o.status!=="complete").length)}
    </div>
    <div class="admin-card">
      <h3>Latest quotations</h3>
      <table class="admin-table"><thead><tr><th>Ref</th><th>Client</th><th>Total</th><th>Status</th></tr></thead><tbody>${recent}</tbody></table>
    </div>
    <div class="admin-card">
      <h3>Low stock</h3>
      ${low.map(p => `<div class="boq-item"><span>${p.name}</span><span class="stock-low">${p.stock} ${p.stockUnit}</span></div>`).join("") || "<p class='hint'>Stock levels are healthy.</p>"}
    </div>`);
}

function analytics() {
  const a = BFS.analytics();
  const days = Object.keys(a.daily).sort().slice(-21);
  const max = Math.max(1, ...days.map(d => a.daily[d].views));
  const bars = days.map(d => `<i title="${d}: ${a.daily[d].views} views" style="height:${Math.round(a.daily[d].views/max*100)}%"></i>`).join("");
  const pages = Object.entries(a.pageviews).sort((x,y)=>y[1]-x[1]).map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  const qTot = days.reduce((s,d)=>s+a.daily[d].quotes,0);
  const iTot = days.reduce((s,d)=>s+a.daily[d].invoices,0);
  return shell("Analytics", `
    <div class="kpi-grid">
      ${kpi("Views (21d)", days.reduce((s,d)=>s+a.daily[d].views,0))}
      ${kpi("Quotes (21d)", qTot)}
      ${kpi("Invoices (21d)", iTot)}
      ${kpi("Pages tracked", Object.keys(a.pageviews).length)}
    </div>
    <div class="admin-card"><h3>Daily page views</h3><div class="bars">${bars}</div></div>
    <div class="admin-card"><h3>Top pages</h3>
      <table class="admin-table"><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody>${pages}</tbody></table>
    </div>`);
}

function products() {
  const rows = BFS.products().map(p => `<tr>
    <td>${p.name}</td><td>${p.category}</td>
    <td>$${p.pricePerM.toFixed(2)}/m</td>
    <td><input type="number" value="${p.stock}" data-id="${p.id}" class="stk" style="width:80px;padding:6px;border:1px solid var(--border);border-radius:8px"></td>
    <td>${p.stockUnit}</td>
    <td><button class="btn btn-sm btn-outline" data-edit="${p.id}">Edit</button></td>
  </tr>`).join("");
  return shell("Inventory", `
    <div class="admin-card">
      <table class="admin-table">
        <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Unit</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div id="editor"></div>`,
    `<button class="btn btn-gold btn-sm" id="addP">Add product</button>`);
}

function productForm(p) {
  p = p || { name:"", category:"Residential", slug:"", short:"", pricePerM:0, rollPrice:0, rollMetres:30, postPrice:0, stock:0, stockUnit:"rolls", image:"assets/img/diamond-mesh.jpg", featured:false };
  return `<div class="modal-bg"><form class="modal" id="pf">
    <h2>${p.id ? "Edit product" : "New product"}</h2>
    <div class="form-grid" style="margin-top:12px">
      <div class="field"><label>Name</label><input name="name" value="${p.name||""}" required></div>
      <div class="field"><label>Slug</label><input name="slug" value="${p.slug||""}"></div>
      <div class="field"><label>Category</label><input name="category" value="${p.category||""}"></div>
      <div class="field"><label>Price / m</label><input name="pricePerM" type="number" step="0.01" value="${p.pricePerM||0}"></div>
      <div class="field"><label>Roll / panel price</label><input name="rollPrice" type="number" step="0.01" value="${p.rollPrice||0}"></div>
      <div class="field"><label>Coverage (m)</label><input name="rollMetres" type="number" value="${p.rollMetres||30}"></div>
      <div class="field"><label>Post price</label><input name="postPrice" type="number" step="0.01" value="${p.postPrice||0}"></div>
      <div class="field"><label>Stock</label><input name="stock" type="number" value="${p.stock||0}"></div>
      <div class="field"><label>Stock unit</label><input name="stockUnit" value="${p.stockUnit||"rolls"}"></div>
      <div class="field"><label>Image path</label><input name="image" value="${p.image||""}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Short description</label><textarea name="short" rows="3">${p.short||""}</textarea></div>
    <label class="hint" style="display:block;margin:10px 0"><input type="checkbox" name="featured" ${p.featured?"checked":""}> Featured on homepage</label>
    <div class="row-actions">
      <button class="btn btn-gold" type="submit">Save</button>
      <button class="btn btn-outline" type="button" id="cancel">Cancel</button>
      ${p.id ? `<button class="btn btn-danger" type="button" id="del">Delete</button>` : ""}
    </div>
  </form></div>`;
}

function bindProducts() {
  document.querySelectorAll(".stk").forEach(inp => inp.onchange = () => {
    const p = BFS.product(inp.dataset.id); p.stock = +inp.value; BFS.saveProduct(p);
  });
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openProduct(BFS.product(b.dataset.edit)));
  const add = document.getElementById("addP");
  if (add) add.onclick = () => openProduct(null);
}
function openProduct(p) {
  const box = document.getElementById("editor");
  box.innerHTML = productForm(p);
  cancel.onclick = () => box.innerHTML = "";
  pf.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(pf);
    const next = Object.assign({}, p || { id: BFS.uid("p"), specs:{}, keywords:[], topWirePerM:0.8, gatePrice:180, installPerM:3.5, concretePerPost:4, description: fd.get("short") });
    ["name","slug","category","image","short","stockUnit"].forEach(k => next[k] = fd.get(k));
    ["pricePerM","rollPrice","rollMetres","postPrice","stock"].forEach(k => next[k] = Number(fd.get(k)));
    next.featured = pf.featured.checked;
    if (!next.slug) next.slug = next.name.toLowerCase().replace(/\s+/g,"-");
    BFS.saveProduct(next); location.hash = "#/products"; render();
  };
  const del = document.getElementById("del");
  if (del) del.onclick = () => { if (confirm("Delete this product?")) { BFS.deleteProduct(p.id); render(); } };
}

function promotions() {
  const rows = BFS.allPromotions().map(p => `<tr>
    <td>${p.title}</td><td>${p.tag}</td><td>${p.active ? "Live" : "Off"}</td>
    <td>${p.starts} → ${p.ends}</td>
    <td class="row-actions">
      <button class="btn btn-sm btn-outline" data-id="${p.id}">Edit</button>
      <button class="btn btn-sm btn-danger" data-del="${p.id}">Delete</button>
    </td></tr>`).join("");
  return shell("Promotions", `
    <div class="admin-card"><table class="admin-table">
      <thead><tr><th>Title</th><th>Tag</th><th>Status</th><th>Dates</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div id="editor"></div>`,
    `<button class="btn btn-gold btn-sm" id="addPr">New promotion</button>`);
}
function promoForm(p) {
  p = p || { title:"", body:"", tag:"Offer", active:true, starts:"2026-11-06", ends:"2026-12-31" };
  return `<div class="modal-bg"><form class="modal" id="prf">
    <h2>${p.id?"Edit":"New"} promotion</h2>
    <div class="field"><label>Title</label><input name="title" value="${p.title}" required></div>
    <div class="field" style="margin-top:8px"><label>Body</label><textarea name="body" rows="3">${p.body||""}</textarea></div>
    <div class="form-grid" style="margin-top:8px">
      <div class="field"><label>Tag</label><input name="tag" value="${p.tag}"></div>
      <div class="field"><label>Starts</label><input type="date" name="starts" value="${p.starts}"></div>
      <div class="field"><label>Ends</label><input type="date" name="ends" value="${p.ends}"></div>
    </div>
    <label class="hint" style="display:block;margin:10px 0"><input type="checkbox" name="active" ${p.active?"checked":""}> Active on the public site</label>
    <div class="row-actions"><button class="btn btn-gold">Save</button><button class="btn btn-outline" type="button" id="cancel">Cancel</button></div>
  </form></div>`;
}
function bindPromos() {
  document.getElementById("addPr").onclick = () => openPromo(null);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openPromo(BFS.allPromotions().find(p => p.id===b.dataset.id)));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { BFS.deletePromotion(b.dataset.del); render(); });
}
function openPromo(p) {
  editor.innerHTML = promoForm(p);
  cancel.onclick = () => editor.innerHTML = "";
  prf.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(prf);
    const next = Object.assign({}, p || {});
    next.title = fd.get("title"); next.body = fd.get("body"); next.tag = fd.get("tag");
    next.starts = fd.get("starts"); next.ends = fd.get("ends"); next.active = prf.active.checked;
    BFS.savePromotion(next); render();
  };
}

function quotes() {
  const rows = BFS.quotes().map(q => `<tr>
    <td><a href="#/quote/${q.ref}">${q.ref}</a></td>
    <td>${q.customer.name}<div class="hint">${q.customer.contact}</div></td>
    <td>${q.project.typeName} · ${q.project.perimeter}m</td>
    <td>$${BFS.money(q.total)}</td>
    <td><span class="badge ${q.status==="converted"?"badge-green":"badge-gold"}">${q.status}</span></td>
    <td>${q.invoiceRef ? `<a href="#/invoice/${q.invoiceRef}">${q.invoiceRef}</a>` : `<button class="btn btn-sm btn-green" data-conv="${q.ref}">Convert to invoice</button>`}</td>
  </tr>`).join("");
  return shell("Quotations", `<div class="admin-card"><table class="admin-table">
    <thead><tr><th>Ref</th><th>Client</th><th>Project</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
}

function quoteDetail(ref) {
  const q = BFS.quote(ref);
  if (!q) return shell("Missing", "<p>Quote not found.</p>");
  const items = q.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>$${BFS.money(i.total)}</td></tr>`).join("");
  const extra = q.invoiceRef
    ? `<a class="btn btn-outline" href="#/invoice/${q.invoiceRef}">Open invoice</a>`
    : `<button class="btn btn-gold" id="conv">Convert to invoice</button>`;
  return shell(q.ref, `
    <div class="admin-card">
      <p><strong>${q.customer.name}</strong> · ${q.customer.contact}<br>${q.project.typeName} · ${q.project.perimeter} m · ${q.project.height} m</p>
      <table class="admin-table"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${items}</tbody></table>
      <p style="margin-top:12px">Subtotal $${BFS.money(q.subtotal)} · VAT $${BFS.money(q.vat)} · <strong>$${BFS.money(q.total)}</strong></p>
      <div class="row-actions" style="margin-top:12px">
        ${extra}
        <a class="btn btn-outline" href="../quote.html?ref=${q.ref}" target="_blank">Public view</a>
      </div>
    </div>`);
}

function convertQuote(ref) {
  const inv = BFS.quoteToInvoice(ref);
  location.hash = "#/invoice/" + inv.ref;
  render();
}

function invoices() {
  const rows = BFS.invoices().map(i => `<tr>
    <td><a href="#/invoice/${i.ref}">${i.ref}</a></td>
    <td>${i.customer.name}</td>
    <td>$${BFS.money(i.total)}</td>
    <td><span class="badge ${i.status==="paid"?"badge-green":"badge-gold"}">${i.status}</span></td>
    <td>${i.tracking || "—"}</td>
    <td>${i.status!=="paid"?`<button class="btn btn-sm btn-green" data-pay="${i.id}">Mark paid</button>`:""}</td>
  </tr>`).join("");
  return shell("Invoices", `<div class="admin-card"><table class="admin-table">
    <thead><tr><th>Ref</th><th>Client</th><th>Total</th><th>Status</th><th>Tracking</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
}

function invoiceDetail(ref) {
  const inv = BFS.invoice(ref);
  if (!inv) return shell("Missing", "<p>Invoice not found.</p>");
  return shell(inv.ref, `
    <div class="admin-card">
      <p>From quote ${inv.quoteRef} · Due ${new Date(inv.dueAt).toLocaleDateString()} · <span class="badge badge-green">${inv.status}</span></p>
      <p><strong>$${BFS.money(inv.total)}</strong> inc VAT</p>
      <div class="row-actions">
        <a class="btn btn-gold" href="../invoice.html?ref=${inv.ref}" target="_blank">Print invoice</a>
        ${inv.tracking ? `<a class="btn btn-outline" href="../track.html?code=${inv.tracking}" target="_blank">Track ${inv.tracking}</a>` : ""}
        ${inv.status!=="paid" ? `<button class="btn btn-green" id="pay">Mark paid</button>` : ""}
      </div>
    </div>`);
}

function orders() {
  const rows = BFS.orders().map(o => `<tr>
    <td>${o.tracking}</td><td>${o.customer.name}</td>
    <td><span class="badge badge-gold">${o.status}</span></td>
    <td>${o.invoiceRef}</td>
    <td>${o.status!=="complete"?`<button class="btn btn-sm btn-gold" data-adv="${o.tracking}">Advance status</button>`:"Done"}</td>
  </tr>`).join("");
  return shell("Orders", `<div class="admin-card"><table class="admin-table">
    <thead><tr><th>Tracking</th><th>Client</th><th>Status</th><th>Invoice</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
}

function gallery() {
  const cards = BFS.gallery().map(g => `<div class="admin-card" style="display:flex;gap:14px;align-items:center">
    <img src="${BFS.asset(g.image)}" alt="" width="96" height="72" style="object-fit:cover;border-radius:8px">
    <div style="flex:1"><strong>${g.title}</strong><div class="hint">${g.location} · ${g.type} · ${g.year}</div></div>
    <button class="btn btn-sm btn-danger" data-del="${g.id}">Remove</button>
  </div>`).join("");
  return shell("Gallery", cards + `<div id="editor"></div>`,
    `<button class="btn btn-gold btn-sm" id="addG">Add photo</button>`);
}

function messages() {
  const rows = BFS.contacts().slice().reverse().map(c => `<tr>
    <td>${new Date(c.at).toLocaleString()}</td><td>${c.name}</td><td>${c.contact}</td><td>${c.message}</td>
  </tr>`).join("") || `<tr><td colspan="4" class="hint">No messages yet. The contact form writes here.</td></tr>`;
  return shell("Messages", `<div class="admin-card"><table class="admin-table">
    <thead><tr><th>When</th><th>Name</th><th>Contact</th><th>Message</th></tr></thead><tbody>${rows}</tbody></table></div>`);
}

function settings() {
  const s = BFS.settings();
  return shell("Settings", `<form class="admin-card" id="sf">
    <div class="form-grid">
      <div class="field"><label>Company</label><input name="company" value="${s.company}"></div>
      <div class="field"><label>Tagline</label><input name="tagline" value="${s.tagline}"></div>
      <div class="field"><label>Email</label><input name="email" value="${s.email}"></div>
      <div class="field"><label>Phone</label><input name="phone" value="${s.phone}"></div>
      <div class="field"><label>WhatsApp (263…)</label><input name="whatsapp" value="${s.whatsapp}"></div>
      <div class="field"><label>Admin username</label><input name="adminUser" value="${s.adminUser}"></div>
      <div class="field"><label>Admin password</label><input name="adminPass" type="password" value="${s.adminPass}"></div>
      <div class="field"><label>VAT rate</label><input name="vatRate" type="number" step="0.01" value="${s.vatRate}"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>Address</label><input name="address" value="${s.address}"></div>
    <div class="field" style="margin-top:10px"><label>Hours</label><input name="hours" value="${s.hours}"></div>
    <div class="field" style="margin-top:10px"><label>Bank details</label><textarea name="bank" rows="2">${s.bank}</textarea></div>
    <button class="btn btn-gold" style="margin-top:14px">Save settings</button>
  </form>
  <div class="admin-card">
    <h3>Data</h3>
    <p class="hint">Everything lives in this browser until you export. On cPanel you can paste the JSON into data backups, or run the optional Python API.</p>
    <div class="row-actions">
      <button class="btn btn-outline" id="exp">Export JSON</button>
      <button class="btn btn-danger" id="rst">Reset demo data</button>
    </div>
  </div>`);
}

function render() {
  if (!requireAuth()) return;
  const [r, id] = route();
  const map = {
    dashboard, analytics, products, promotions, quotes, invoices, orders, gallery, messages, settings
  };
  let html;
  if (r === "quote" && id) html = quoteDetail(id);
  else if (r === "invoice" && id) html = invoiceDetail(id);
  else html = (map[r] || dashboard)();
  document.getElementById("app").innerHTML = html;
  const lo = document.getElementById("logout");
  if (lo) lo.onclick = () => { BFS.logout(); renderLogin(); };

  if (r === "products") bindProducts();
  if (r === "promotions") bindPromos();
  if (r === "quotes") {
    document.querySelectorAll("[data-conv]").forEach(b => b.onclick = () => convertQuote(b.dataset.conv));
  }
  if (r === "quote" && id) {
    const c = document.getElementById("conv");
    if (c) c.onclick = () => convertQuote(id);
  }
  if (r === "invoices") {
    document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => {
      const inv = BFS.invoices().find(i => i.id === b.dataset.pay);
      inv.status = "paid"; inv.paid = inv.total; BFS.saveInvoice(inv);
      const o = BFS.order(inv.tracking || inv.ref); if (o && o.status === "pending") BFS.advanceOrder(o.tracking);
      render();
    });
  }
  if (r === "invoice" && id) {
    const p = document.getElementById("pay");
    if (p) p.onclick = () => {
      const inv = BFS.invoice(id);
      inv.status = "paid"; inv.paid = inv.total; BFS.saveInvoice(inv);
      const o = BFS.order(inv.tracking || inv.ref);
      if (o && o.status === "pending") BFS.advanceOrder(o.tracking);
      render();
    };
  }
  if (r === "orders") {
    document.querySelectorAll("[data-adv]").forEach(b => b.onclick = () => { BFS.advanceOrder(b.dataset.adv); render(); });
  }
  if (r === "gallery") {
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { BFS.deleteGallery(b.dataset.del); render(); });
    document.getElementById("addG").onclick = () => {
      const title = prompt("Caption"); if (!title) return;
      BFS.saveGallery({ title, location: "Harare", type: "Diamond Mesh", year: 2026, image: "assets/img/gallery-residential.jpg" });
      render();
    };
  }
  if (r === "settings") {
    sf.onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(sf);
      const patch = {};
      fd.forEach((v,k) => patch[k] = k==="vatRate" ? Number(v) : v);
      BFS.saveSettings(patch);
      alert("Settings saved.");
    };
    exp.onclick = () => {
      const blob = new Blob([BFS.export()], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "barrier-fencing-data.json"; a.click();
    };
    rst.onclick = () => { if (confirm("Reset all local data to the demo seed?")) { BFS.reset(); render(); } };
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("load", render);
</script>
</body>
</html>
