<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Barrier Builders</title>
  <meta name="description" content="Completed fencing installations across Zimbabwe — farms, schools, estates and commercial yards.">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=6">
</head>
<body>
<div id="site-header"></div>
<section class="page-hero" style="background-image:url('../assets/img/gallery-game.jpg')">
  <div class="container">
    <div class="crumbs"><a href="../index">Home</a> <span class="sep">›</span> Gallery</div>
    <h1>Work on the ground</h1>
    <p>Farms, schools, estates and commercial perimeters. Photos are managed from the admin gallery.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="chips" id="cats" style="margin-bottom:22px"></div>
    <div class="gallery-grid" id="grid"></div>
  </div>
</section>
<div id="site-footer"></div>
<script src="../js/store.js?v=15"></script>
<script src="../js/ui.js?v=8"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  let type = "All";
  const types = ["All", ...new Set(BFS.gallery().map(g => g.type))];
  function render() {
    cats.innerHTML = types.map(t => `<button class="chip ${t===type?"on":""}" data-t="${t}">${t}</button>`).join("");
    const items = BFS.gallery().filter(g => type==="All" || g.type===type);
    grid.innerHTML = items.map(g => `
      <figure class="gallery-item">
        <img src="${BFS.asset(g.image)}" alt="${g.title}">
        <figcaption>${g.title}<br><span style="opacity:.8">${g.location} · ${g.year}</span></figcaption>
      </figure>`).join("");
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { type = b.dataset.t; render(); });
  }
  render();
});
</script>
</body>
</html>
