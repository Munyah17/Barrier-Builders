<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal | Barrier Builders</title>
  <meta name="description" content="Client portal — view your orders, complete KYC, and manage your Barrier Builders account.">
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=6">
</head>
<body>
<div id="site-header"></div>
<section class="section" style="padding-top:48px">
  <div class="container" style="max-width:960px" id="app"></div>
</section>
<div id="site-footer"></div>
<script src="../js/store.js?v=15"></script>
<script src="../js/ui.js?v=8"></script>
<script>
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + BFS.money(n);

function nav(tab) {
  const c = BFS.clientAuthed(); if (!c) return "";
  const link = (k, label, icon) => `<a href="#${k}" class="portal-tab ${tab===k?"on":""}">${icon} ${label}</a>`;
  return `<div class="portal-tabs">
    ${link("orders","Orders","▦")}
    ${link("notifications","Alerts","◈")}
    ${link("kyc","KYC","✓")}
    ${link("promos","Promotions","★")}
    ${link("settings","Settings","⚙")}
    <a href="#" class="portal-tab" id="pout">Sign out</a>
  </div>`;
}

function shell(tab, title, body) {
  return `<div class="kicker">Client Portal</div><h1 style="font-size:clamp(26px,3vw,36px);margin-bottom:6px">${esc(title)}</h1>
  ${nav(tab)}<div style="margin-top:22px">${body}</div>`;
}

/* ---------- AUTH ---------- */
function renderAuth(mode) {
  mode = mode || "login";
  app.innerHTML = `<div class="portal-auth">
    <div class="panel portal-auth-card" style="max-width:460px;margin:0 auto">
      <div class="panel-body">
        <img src="../assets/logo.png" alt="" width="52" height="52" style="margin-bottom:10px">
        <h2 style="margin-bottom:4px">${mode==="login" ? "Welcome back" : "Create your account"}</h2>
        <p class="hint" style="margin-bottom:18px">${mode==="login" ? "Access your orders and documents." : "Register to track orders and manage your details."}</p>
        <form id="af">
          ${mode==="register" ? `<div class="field"><label>Full name</label><input name="name" required></div>` : ""}
          <div class="field" style="margin-top:10px"><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
          ${mode==="register" ? `<div class="field" style="margin-top:10px"><label>Phone / WhatsApp</label><input name="phone" placeholder="0772 000 000"></div>` : ""}
          <div class="field" style="margin-top:10px"><label>Password</label><input name="password" type="password" required minlength="6" autocomplete="${mode==="login"?"current-password":"new-password"}"></div>
          <button class="btn btn-gold btn-block" style="margin-top:16px">${mode==="login"?"Sign in":"Create account"}</button>
          <p class="hint" id="aerr" style="color:var(--danger);margin-top:10px"></p>
        </form>
        <p class="hint" style="margin-top:14px;text-align:center">
          ${mode==="login" ? `New here? <a href="#register" style="color:var(--green);font-weight:600">Create an account</a>` : `Have an account? <a href="#login" style="color:var(--green);font-weight:600">Sign in</a>`}
        </p>
      </div>
    </div>
  </div>`;
  af.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(af);
    try {
      if (mode === "login") {
        const c = await BFS.clientLogin(fd.get("email"), fd.get("password"));
        if (!c) { aerr.textContent = "Invalid credentials."; return; }
      } else {
        await BFS.registerClient({ name: fd.get("name"), email: fd.get("email"), phone: fd.get("phone"), password: fd.get("password") });
      }
      BFSUI.mount();
      location.hash = "#/orders"; render();
    } catch (err) { aerr.textContent = err.message; }
  };
}

/* ---------- ORDERS ---------- */
function renderOrders() {
  const c = BFS.clientAuthed(); if (!c) return renderAuth();
  const orders = BFS.clientOrders(c);
  const cards = orders.map(o => {
    const done = o.steps.filter(s => s.done).length;
    const pct = Math.round(done / o.steps.length * 100);
    const steps = o.steps.map(s => `<div class="tl-item ${s.done?"done":""} ${s.done&&s===o.steps.find(x=>!x.done)?"current":""}">
      <span class="tl-dot"></span><div><strong style="font-size:13px">${s.label}</strong>
      <div class="hint">${s.at ? new Date(s.at).toLocaleDateString("en-GB") : "Pending"}</div></div></div>`).join("");
    return `<div class="panel portal-order"><div class="panel-body">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
          <div><strong>${o.tracking}</strong> <span class="badge badge-gold">${o.status}</span>
            <div class="hint">Placed ${new Date(o.createdAt).toLocaleDateString("en-GB")} · Invoice ${o.invoiceRef||"—"}</div></div>
          <div style="min-width:160px;flex:1;max-width:280px">
            <div class="hint" style="margin-bottom:4px">${done}/${o.steps.length} stages</div>
            <div style="height:8px;background:var(--border);border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--green)"></div></div>
          </div>
        </div>
        <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--green);font-weight:600">View delivery timeline</summary>
          <div class="timeline" style="margin-top:14px">${steps}</div></details>
      </div></div>`;
  }).join("");
  app.innerHTML = shell("orders", "My orders", orders.length ? cards :
    `<div class="panel"><div class="panel-body"><p class="hint">No orders yet. Orders placed against your email or phone will appear here.</p>
     <a class="btn btn-outline" href="../calculator" style="margin-top:10px">Get a quote</a></div></div>`);
}

/* ---------- KYC ---------- */
function renderKyc() {
  const c = BFS.clientAuthed(); if (!c) return renderAuth();
  const k = c.kyc;
  const statusBadge = k ? `<span class="badge ${k.status==="verified"?"badge-green":k.status==="rejected"?"badge-red":"badge-gold"}">${k.status}</span>` : `<span class="badge badge-grey">Not submitted</span>`;
  const banner = !k
    ? `<div class="portal-kyc-banner warn">⚠ You haven't submitted identity verification yet.</div>`
    : k.status === "verified"
      ? `<div class="portal-kyc-banner ok">✓ Your identity is verified. Nothing else needed.</div>`
      : k.status === "rejected"
        ? `<div class="portal-kyc-banner bad">✕ Your submission was rejected — please update your details and resubmit.</div>`
        : `<div class="portal-kyc-banner warn">⏳ Your submission is pending review by our team.</div>`;
  app.innerHTML = shell("kyc", "Identity verification (KYC)", `
    ${banner}
    <div class="panel" style="max-width:640px"><div class="panel-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <p class="hint" style="margin:0">Verify your identity to speed up deliveries and invoicing.</p>${statusBadge}
      </div>
      ${k && k.status==="verified" ? `<p class="hint">Your identity is verified. Nothing else needed.</p>` : `
      <form id="kf" class="form-grid">
        <div class="field"><label>Full name (as on ID)</label><input name="fullName" value="${esc(k?.fullName||c.name)}" required></div>
        <div class="field"><label>ID type</label>
          <select name="idType"><option ${k?.idType==="National ID"?"selected":""}>National ID</option><option ${k?.idType==="Passport"?"selected":""}>Passport</option><option ${k?.idType==="Driver's licence"?"selected":""}>Driver's licence</option></select></div>
        <div class="field"><label>ID / passport number</label><input name="idNumber" value="${esc(k?.idNumber||"")}" required></div>
        <div class="field"><label>Proof of address</label><input name="proofAddress" value="${esc(k?.proofAddress||"")}" placeholder="Street, suburb, city"></div>
        <div class="field" style="grid-column:1/-1"><label>ID document reference</label><input name="idDoc" value="${esc(k?.idDoc||"")}" placeholder="e.g. scanned copy emailed to info@barrierfencing.co.zw"></div>
        <div><button class="btn btn-gold">${k ? "Update submission" : "Submit for verification"}</button></div>
      </form>`}
    </div></div>`);
  const kf = document.getElementById("kf");
  if (kf) kf.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(kf);
    c.kyc = { fullName: fd.get("fullName"), idType: fd.get("idType"), idNumber: fd.get("idNumber"),
      proofAddress: fd.get("proofAddress"), idDoc: fd.get("idDoc"), status: "pending", at: new Date().toISOString() };
    BFS.saveClient(c); render();
  };
}

/* ---------- NOTIFICATIONS ---------- */
const NTF_ICONS = {
  order: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>',
  kyc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.2-7 9.5C8 19.2 5 15.6 5 11V6l7-3z"/><path d="M9.5 11.5l2 2 3.5-4"/></svg>',
  promo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5V4a1 1 0 0 1 1-1h7.4a1 1 0 0 1 .7.3l8.4 8.4a1.5 1.5 0 0 1 0 2.1l-6.5 6.5a1.5 1.5 0 0 1-2.1 0l-8.4-8.4a1 1 0 0 1-.3-.7z"/><circle cx="8" cy="8.5" r="1.4"/></svg>',
  hi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>'
};
function renderNotifications() {
  const c = BFS.clientAuthed(); if (!c) return renderAuth();
  const items = [];
  BFS.clientOrders(c).forEach(o => {
    items.push({ kind: "order", title: `Order ${o.tracking} placed`, sub: `${o.steps.length} delivery stages · Invoice ${o.invoiceRef || "—"}`, at: o.createdAt });
    o.steps.forEach(s => { if (s.done && s.at) items.push({ kind: "order", title: `${o.tracking} — ${s.label}`, sub: "", at: s.at }); });
  });
  if (c.kyc) items.push({ kind: "kyc", title: `Identity verification ${c.kyc.status}`, sub: `Submitted ${c.kyc.at ? new Date(c.kyc.at).toLocaleDateString("en-GB") : "—"}`, at: c.kyc.reviewedAt || c.kyc.at });
  BFS.promotions().forEach(p => items.push({ kind: "promo", title: `Promotion: ${p.title}`, sub: p.body, at: p.starts }));
  items.push({ kind: "hi", title: "Welcome to your Barrier Builders portal", sub: "Track orders, verify your identity and catch promotions here.", at: c.createdAt });
  items.sort((a, b) => String(b.at || "").localeCompare(String(a.at || "")));
  const list = items.slice(0, 40).map(n => `
    <div class="ntf ntf-${n.kind}">
      <span class="ntf-ico">${NTF_ICONS[n.kind] || NTF_ICONS.hi}</span>
      <div style="flex:1;min-width:0"><strong style="font-size:14px">${esc(n.title)}</strong>
        ${n.sub ? `<p class="hint" style="margin:2px 0 0">${esc(n.sub)}</p>` : ""}</div>
      <span class="hint ntf-date">${n.at ? new Date(n.at).toLocaleDateString("en-GB") : ""}</span>
    </div>`).join("");
  app.innerHTML = shell("notifications", "Notifications", list ||
    `<div class="panel"><div class="panel-body"><p class="hint">No notifications yet.</p></div></div>`);
}

/* ---------- PROMOTIONS ---------- */
function renderPromos() {
  const c = BFS.clientAuthed(); if (!c) return renderAuth();
  const promos = BFS.promotions();
  app.innerHTML = shell("promos", "Promotions", promos.length ? promos.map(p => `
    <div class="panel" style="margin-bottom:14px"><div class="panel-body">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
        <div><strong>${esc(p.title)}</strong> <span class="badge badge-gold">${esc(p.tag)}</span>
        <p class="hint" style="margin:6px 0 0">${esc(p.body)}</p></div>
        <span class="hint">${p.starts} → ${p.ends}</span>
      </div></div></div>`).join("") :
    `<div class="panel"><div class="panel-body"><p class="hint">No active promotions right now.</p></div></div>`);
}

/* ---------- SETTINGS / PROFILE ---------- */
function renderSettings() {
  const c = BFS.clientAuthed(); if (!c) return renderAuth();
  const avatar = c.avatar || "";
  app.innerHTML = shell("settings", "Profile & settings", `
    <div class="panel" style="max-width:560px"><div class="panel-body">
      <div class="portal-avatar-row">
        ${avatar ? `<img src="${avatar}" alt="" width="72" height="72" style="border-radius:50%;object-fit:cover;flex-shrink:0">` : `<div style="width:72px;height:72px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;color:var(--green);flex-shrink:0"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>`}
        <div class="portal-avatar-uploader"><label for="pavatar">Profile photo</label><input type="file" id="pavatar" accept="image/*"></div>
      </div>
      <form id="sf" class="form-grid">
        <div class="field"><label>Full name</label><input name="name" value="${esc(c.name)}"></div>
        <div class="field"><label>Username / email</label><input value="${esc(c.email)}" disabled><span class="hint">Email cannot be changed — contact us to update it.</span></div>
        <div class="field"><label>Phone / WhatsApp</label><input name="phone" value="${esc(c.phone||"")}"></div>
        <div class="field" style="grid-column:1/-1"><label>New password (leave blank to keep)</label><input name="password" type="password" minlength="6" autocomplete="new-password"></div>
        <div><button class="btn btn-gold">Save changes</button></div>
      </form>
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end">
        <button class="btn btn-outline" id="pout" type="button" style="color:var(--danger);border-color:#E5B8B4">Sign out</button>
      </div>
    </div></div>`);
  let avatarData = c.avatar || "";
  const av = document.getElementById("pavatar");
  if (av) av.onchange = () => {
    const file = av.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { avatarData = reader.result; };
    reader.readAsDataURL(file);
  };
  sf.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(sf);
    const pw = fd.get("password");
    c.name = fd.get("name") || c.name;
    c.phone = fd.get("phone") || "";
    if (avatarData) c.avatar = avatarData;
    if (pw) {
      const ok = await BFS.clientChangePassword(pw);
      if (!ok) { BFSUI.toast("Password change failed — try again."); return; }
    }
    BFS.saveClient(c); BFSUI.toast("Settings saved."); render();
  };
}

/* ---------- BOTTOM NAV (mobile, logged-in) ---------- */
const BNAV_ICONS = {
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>',
  kyc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.6-3 8.2-7 9.5C8 19.2 5 15.6 5 11V6l7-3z"/><path d="M9.5 11.5l2 2 3.5-4"/></svg>',
  quote: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/></svg>',
  promos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5V4a1 1 0 0 1 1-1h7.4a1 1 0 0 1 .7.3l8.4 8.4a1.5 1.5 0 0 1 0 2.1l-6.5 6.5a1.5 1.5 0 0 1-2.1 0l-8.4-8.4a1 1 0 0 1-.3-.7z"/><circle cx="8" cy="8.5" r="1.4"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
let bnavEl = null;
function syncBottomNav() {
  if (!BFS.clientAuthed()) {
    if (bnavEl) { bnavEl.remove(); bnavEl = null; }
    document.body.classList.remove("bnav-on");
    return;
  }
  if (!bnavEl) {
    bnavEl = document.createElement("nav");
    bnavEl.className = "bottom-nav";
    bnavEl.setAttribute("aria-label", "Portal navigation");
    document.body.appendChild(bnavEl);
  }
  const r = route();
  const item = (k, label) => `<a class="bn-item ${r===k?"on":""}" href="#${k}">${BNAV_ICONS[k]}<span>${label}</span></a>`;
  bnavEl.innerHTML =
    item("orders","Orders") + item("kyc","KYC") +
    `<a class="bn-item bn-center" href="../calculator"><span class="bn-fab">${BNAV_ICONS.quote}</span><span>Quote</span></a>` +
    item("promos","Promos") + item("settings","Settings");
  document.body.classList.add("bnav-on");
}

/* ---------- ROUTER ---------- */
function route() { return (location.hash.replace(/^#\/?/, "") || "orders"); }
function render() {
  const r = route();
  if (r === "login" || r === "register") renderAuth(r === "register" ? "register" : "login");
  else if (!BFS.clientAuthed()) renderAuth();
  else if (r === "orders") renderOrders();
  else if (r === "notifications") renderNotifications();
  else if (r === "kyc") renderKyc();
  else if (r === "promos") renderPromos();
  else if (r === "settings") renderSettings();
  else renderOrders();
  syncBottomNav();
}
window.addEventListener("hashchange", render);
window.addEventListener("bfs-accounts", render);
document.addEventListener("DOMContentLoaded", () => {
  document.addEventListener("click", e => {
    if (e.target.closest("#pout")) { e.preventDefault(); BFS.clientLogout(); BFSUI.mount(); location.hash = "#/login"; render(); }
  });
  render();
});
</script>
<style>
/* ---- Client portal ---- */
.portal-auth{padding-top:30px;max-width:460px;margin:0 auto}
.portal-auth-card{border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(6,32,22,.14);border:none}
.portal-auth-card .panel-body{padding:34px 30px}
.portal-auth-card img{filter:drop-shadow(0 4px 10px rgba(0,114,67,.25))}
.portal-auth-card h2{font-family:Fraunces,serif;font-size:26px;color:var(--green-dark)}
.portal-auth-card .field input{padding:13px 14px;border-radius:12px}
.portal-auth-card .btn-gold{padding:14px;font-size:15px;border-radius:12px;box-shadow:0 8px 20px rgba(230,179,37,.4)}

.portal-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 6px;padding:6px;background:#fff;border:1px solid var(--border);border-radius:999px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.portal-tab{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);text-decoration:none;transition:.18s}
.portal-tab:hover{color:var(--green);background:var(--green-soft)}
.portal-tab.on{background:linear-gradient(135deg,var(--green-mid),var(--green));color:#fff;box-shadow:0 4px 12px rgba(0,114,67,.3)}
.portal-tab#pout:hover{background:#FEE4E2;color:var(--danger)}

.portal-order{border-radius:16px;transition:box-shadow .2s,transform .2s}
.portal-order:hover{box-shadow:0 10px 30px rgba(6,32,22,.1);transform:translateY(-2px)}
.portal-order .panel-body{padding:24px 26px}
.portal-order details summary{list-style:none}
.portal-order details summary::-webkit-details-marker{display:none}
.portal-order details[open] summary{margin-bottom:8px}

.portal-kyc-banner{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:14px;margin-bottom:18px;font-size:14px}
.portal-kyc-banner.ok{background:var(--green-soft);border:1px solid var(--green-line);color:var(--green-dark)}
.portal-kyc-banner.warn{background:var(--gold-soft);border:1px solid #EBD9A0;color:#7A5B06}
.portal-kyc-banner.bad{background:#FEE4E2;border:1px solid #F5C6C2;color:var(--danger)}

.ntf{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:#fff;margin-bottom:10px}
